<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Tiffany & Co. logo">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#77ded0"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".45"/>
  <text x="800" y="505" text-anchor="middle" fill="#18211f" font-family="Georgia, 'Times New Roman', serif" font-size="235" font-weight="700" letter-spacing="10">TIFFANY &amp; CO.</text>
</svg>
